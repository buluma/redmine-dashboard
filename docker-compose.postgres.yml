services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOCKER_POSTGRES_DB:-redmine_dashboard}
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DOCKER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_POSTGRES_USER:-postgres} -d ${DOCKER_POSTGRES_DB:-redmine_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRISMA_SCHEMA: prisma/schema.prisma
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DOCKER_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_POSTGRES_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/redmine_dashboard}
      DIRECT_URL: ${DOCKER_POSTGRES_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/redmine_dashboard}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      ENABLE_SYNC_POLLER: ${ENABLE_SYNC_POLLER:-true}
      ENABLE_STREAMLINE_LOG_POLLER: ${ENABLE_STREAMLINE_LOG_POLLER:-false}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-300000}
      LEADER_LOCK_TTL_MS: ${LEADER_LOCK_TTL_MS:-90000}
      SYNC_JOB_STALE_MS: ${SYNC_JOB_STALE_MS:-600000}
      MOBILE_API_ENABLED: ${MOBILE_API_ENABLED:-true}
      PRISMA_SCHEMA_PATH: prisma/schema.prisma
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
