services:
  dashboard:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-file:./prisma/dev.db}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-60000}
      LEADER_LOCK_TTL_MS: ${LEADER_LOCK_TTL_MS:-90000}
      SYNC_JOB_STALE_MS: ${SYNC_JOB_STALE_MS:-600000}
      MOBILE_API_ENABLED: ${MOBILE_API_ENABLED:-true}
      REDMINE_BASE_URL: ${REDMINE_BASE_URL:-}
      REDMINE_API_KEY: ${REDMINE_API_KEY:-}
      NODE_ENV: production
    volumes:
      - ./prisma:/app/prisma
